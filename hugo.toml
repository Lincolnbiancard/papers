baseURL = 'https://lincolnbiancard.github.io/papers/'
locale = 'pt-BR'
title = 'Papers para o dono'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = 'Papers sérios sobre IA nas empresas, traduzidos para o português, para donos de PME. Por Lincoln Biancardi.'
  author = 'Lincoln Biancardi'

[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      typographer = false
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true

[outputs]
  home = ['HTML', 'RSS']

[menus]
  [[menus.main]]
    name = 'Papers'
    url = '/'
    weight = 1
  [[menus.main]]
    name = 'Sobre'
    url = '/sobre/'
    weight = 2
