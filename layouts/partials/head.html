<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem("papers-tema");
        var tema = salvo || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
        document.documentElement.setAttribute("data-tema", tema);
      } catch (e) {
        document.documentElement.setAttribute("data-tema", "claro");
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ with .Params.author }}{{ . }}{{ else }}{{ .Site.Params.author }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:locale" content="pt_BR">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="preload" href="{{ "fonts/source-serif-4-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Source Serif 4";
      src: url("{{ "fonts/source-serif-4-latin-wght-normal.woff2" | relURL }}") format("woff2");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Source Serif 4";
      src: url("{{ "fonts/source-serif-4-latin-wght-italic.woff2" | relURL }}") format("woff2");
      font-weight: 200 900;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("{{ "fonts/source-sans-3-latin-wght-normal.woff2" | relURL }}") format("woff2");
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Source Sans 3";
      src: url("{{ "fonts/source-sans-3-latin-wght-italic.woff2" | relURL }}") format("woff2");
      font-weight: 200 900;
      font-style: italic;
      font-display: swap;
    }
  </style>
  {{- $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{- range .AlternativeOutputFormats }}
  <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}">
  {{- end }}
</head>
